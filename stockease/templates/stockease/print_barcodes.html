<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; }
            .no-print { display: none; }
        }
        .barcode-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .barcode-item {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            page-break-inside: avoid;
        }
        .barcode-item h6 {
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container my-4 no-print">
        <h1 class="mb-4">{{ title }}</h1>
        <p>This page is optimized for printing. Click the button below to open the print dialog.</p>
        {% if items %}
            <button onclick="window.print()" class="btn btn-primary">Print Now</button>
        {% endif %}
        <a href="{% url 'item_list' %}" class="btn btn-secondary">Back to Inventory</a>
    </div>

    <div class="barcode-container">
        {% for item in items %}
            <div class="barcode-item">
                <h6>{{ item.name }}</h6>
                <svg class="barcode"
                     jsbarcode-format="CODE128"
                     jsbarcode-value="{{ item.barcode }}"
                     jsbarcode-textmargin="0"
                     jsbarcode-fontoptions="bold"
                     jsbarcode-height="60">
                </svg>
            </div>
        {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            try {
                JsBarcode(".barcode").init();
            } catch (e) {
                console.error("Could not initialize JsBarcode", e);
            }
        });
    </script>
</body>
</html>
